    "description":"<!-- wp:paragraph --> <p>Jawwaad Spann &amp; The Vintage Society<br>Event Date: October 24, 2026<br>Event Time: 9:00pm - 11:00pm<br>Show Location: The Dark Room<br>DOORS: 8PM<br>SHOW: 9PM</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>Jawwaad Spann &amp; The Vintage Society is a St. Louis–born ensemble led by saxophonist, producer, and multidisciplinary creative Jawwaad Spann. More than a band, The Vintage Society represents a creative world where jazz, hip-hop, soul, timeless Black Style, and modern sophistication exist in the same room.</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>Growing up on the West Side of St. Louis, Jawwaad developed his musical identity surrounded by the rhythm, character, and soul of the city. Those roots continue to shape an approach that honors the tradition of jazz without being confined by it—pairing improvisation and musicianship with the rawness of hip-hop, the warmth of soul, and a distinctly modern perspective.</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>Throughout his journey, Jawwaad has shared stages with acclaimed artists including Wynton Marsalis, Jazzmeia Horn, Keyon Harrold, and Casey Benjamin, while also producing music for Mick Jenkins. His creative footprint remains deeply connected to his hometown, with collaborations alongside St. Louis artists including Blvck Spvde, Katarra, Brady Lewis, We Are Root Mod, and Kudda, among others.</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>The Vintage Society is built around the belief that vintage is more than an era—it is a standard. It represents preserving the elegance, musicianship, community, and individuality of generations before us while creating something that belongs unmistakably to the present. It is Black Ivy League refinement with West Side soul: tailored silhouettes, horns speaking, and hip-hop informing the rhythm beneath it all.</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>Jawwaad Spann &amp; The Vintage Society move freely between jazz, hip-hop, R&amp;B, and soul, creating performances where standards can meet grooves, improvisation can meet production, and nostalgia can meet something entirely new.</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>Learn more <a href='https://kranzbergartsfoundation.org/the-dark-room/'>here!</a></p> <!-- /wp:paragraph -->","location":[{"@type":"Place","name":"The Dark Room","address":{"@type": "PostalAddress","streetAddress":"3610 Grandel Sq., St. Louis, MO 63103"}}]}</script></head><body>eventon</body></html>
